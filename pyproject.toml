[project]
name = "rag5"
version = "0.1.0"
description = "RAG system using MongoDB Atlas Vector Search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "motor>=3.5",
    "pymongo>=4.7",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
    "pypdf2>=3.0",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
