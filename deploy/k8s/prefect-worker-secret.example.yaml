# Copy this file to `prefect-worker-secret.yaml`, fill in real values,
# and `kubectl apply -f prefect-worker-secret.yaml`. Do NOT commit the
# populated copy.
#
# If you use Prefect Cloud, set PREFECT_API_URL to
# https://api.prefect.cloud/api/accounts/<acct>/workspaces/<ws>
# and include a PREFECT_API_KEY.
#
# If you use a self-hosted Prefect server inside the cluster, point
# PREFECT_API_URL at its ClusterIP service and leave PREFECT_API_KEY
# empty (or omit it entirely).
apiVersion: v1
kind: Secret
metadata:
  name: prefect-worker-env
  namespace: rag5
type: Opaque
stringData:
  PREFECT_API_URL: "http://prefect-server.prefect.svc.cluster.local:4200/api"
  PREFECT_API_KEY: ""
  # MongoDB + OpenAI credentials the flow needs to actually ingest.
  # The worker executes the same ingest code as the API, so it needs
  # the same backing services.
  MONGODB_URI: "mongodb+srv://user:pass@cluster.mongodb.net/rag5"
  MONGODB_DB_NAME: "rag5"
  OPENAI_API_KEY: "sk-..."
